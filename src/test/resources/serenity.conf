webdriver {
  driver = chrome
  autodownload = true
  wait.for.timeout = 20000

  chrome {
    webdriver {
      driver = chrome
      autodownload = true
      capabilities {
        browserName = "chrome"
        acceptInsecureCerts = true
        "goog:chromeOptions" {
          args = [
            "--remote-allow-origins=*",
            "--start-maximized",
            "--ignore-certificate-errors",
            "--disable-web-security",
            "--incognito"
          ]
        }
        timeouts {
          implicit = 15000
          pageLoad = 30000
          script = 30000
        }
      }
    }
  }

  edge {
    webdriver {
      capabilities {
        browserName = "MicrosoftEdge"
        "ms:edgeOptions" {
          args = [
            "--remote-allow-origins=*",
            "--test-type",
            "--ignore-certificate-errors",
            "--disable-infobars",
            "--incognito",
            "--disable-gpu",
            "--disable-default-apps",
            "--disable-popup-blocking"
          ]
        }
      }
    }
  }

  firefox {
    webdriver {
      capabilities {
        browserName = "firefox"
        acceptInsecureCerts = true
        pageLoadStrategy = "normal"
        unhandledPromptBehavior = "dismiss"
        strictFileInteractability = true

        timeouts {
          implicit = 15000
          pageLoad = 30000
          script = 30000
        }

        "moz:firefoxOptions" {
          args = [
            "--remote-allow-origins=*",
            "--ignore-certificate-errors"
          ]
          prefs {
            "javascript.options.showInConsole" = false
          }
          log {
            level = "info"
          }
        }
      }
    }
  }
}

headless.mode = false
serenity.browser.maximized = true

serenity {
  take.screenshots = AFTER_EACH_STEP
}

#Linux
linux.firefox {
  webdriver {
    capabilities {
      browserName = "firefox"
      acceptInsecureCerts = true

      "moz:firefoxOptions" {
        args = [
          "--headless",
          "--no-sandbox",
          "--disable-gpu",
          "--ignore-certificate-errors"
        ]
        prefs {
          "javascript.options.showInConsole" = false
        }
      }
    }
  }
}
