name: UI Tests - Selenium Cucumber Serenity

on: [push, pull_request]

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Run Smoke Tests
        run: mvn clean verify -Dcucumber.filter.tags="@smoke" -Dheadless.mode=true

  regression-tests:
    runs-on: ubuntu-latest
    name: Regression Tests
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Run Regression Tests
        run: mvn clean verify -Dcucumber.filter.tags="@regresion" -Dheadless.mode=true

  feature-tests:
    runs-on: ubuntu-latest
    name: Feature & Validation Tests
    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'zulu'
      - name: Run Feature Tests
        run: mvn clean verify -Dcucumber.filter.tags="@passwordRecovery or @validacionCampo" -Dheadless.mode=true
