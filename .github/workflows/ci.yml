name: UI Tests - Selenium Cucumber Serenity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    name: Smoke Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Smoke Tests
        run: mvn -B clean verify -Dcucumber.filter.tags="@smoke" -Dheadless.mode=true

      - name: Generate Serenity Report
        if: always()
        run: mvn -B serenity:aggregate

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-smoke-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/site/serenity
            target/serenity
          retention-days: 30
          if-no-files-found: warn

  regression-tests:
    runs-on: ubuntu-latest
    name: Regression Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Regression Tests
        run: mvn -B clean verify -Dcucumber.filter.tags="@regresion" -Dheadless.mode=true

      - name: Generate Serenity Report
        if: always()
        run: mvn -B serenity:aggregate

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-regression-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/site/serenity
            target/serenity
          retention-days: 30
          if-no-files-found: warn

  feature-tests:
    runs-on: ubuntu-latest
    name: Feature & Validation Tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Feature Tests
        run: mvn -B clean verify -Dcucumber.filter.tags="@passwordRecovery or @validacionCampo" -Dheadless.mode=true

      - name: Generate Serenity Report
        if: always()
        run: mvn -B serenity:aggregate

      - name: Upload Serenity Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: serenity-feature-validation-${{ github.run_number }}-${{ github.sha }}
          path: |
            target/site/serenity
            target/serenity
          retention-days: 30
          if-no-files-found: warn

